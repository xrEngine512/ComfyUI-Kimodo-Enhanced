[project]
name = "comfyui-kimodo-enhanced"
version = "1.0.0"
description = "Enhanced fork of ComfyUI-Kimodo — text-driven 3D human motion (NVIDIA Kimodo) with a rebuilt retarget/export stack: glb + FBX export, A-pose arm fix, travelling root motion, finger and orientation handling."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Runtime deps are tracked in requirements.txt (ComfyUI Manager reads that).
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/stevelittlefish/ComfyUI-Kimodo-Enhanced"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# --- ComfyUI Manager / registry metadata ---
[tool.comfy]
PublisherId = "stevelittlefish"
DisplayName = "ComfyUI-Kimodo-Enhanced"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
